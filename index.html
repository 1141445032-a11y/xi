<style>
/* Layout: an iPhone-sized app canvas (full screen on phones, framed on desktop); iOS grouped-list grayscale with black primary actions */
:root{
  --page:#E5E5EA; --bg:#F2F2F7; --card:#FFFFFF; --ink:#1D1D1F; --ink2:#3C3C43; --mute:#6E6E73; --line:#E5E5EA; --fill:#F2F2F7; --dark:#000000; --ok:#1D1D1F;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;
  color-scheme:light;
}
/* ---- 外觀主題（素色） ---- */
:root{--dim:color-mix(in srgb,var(--mute) 62%,var(--card));--acc:var(--ink);--hair:#C7C7CC;--onink:#FFFFFF;--err:#D70015;--tabbg:rgba(249,249,249,.9);--tabsolid:#F9F9F9;--navbg:rgba(242,242,247,.9);--glass:rgba(255,255,255,.88)}
html[data-theme="dark"]{--acc:#F5F5F7;--page:#0B0B0C;--bg:#000000;--card:#1C1C1E;--ink:#F5F5F7;--ink2:#D1D1D6;--mute:#98989F;--line:#38383A;--fill:#2C2C2E;--hair:#48484A;--dark:#F5F5F7;--onink:#000000;--err:#FF6961;--tabbg:rgba(22,22,24,.9);--tabsolid:#161618;--navbg:rgba(0,0,0,.85);--glass:rgba(44,44,46,.9);color-scheme:dark}
html[data-theme="mist"]{--page:#C6DCE7;--bg:#DCEAF2;--card:#F6FAFC;--ink:#1C2733;--ink2:#34465A;--mute:#5F7789;--line:#C4DCE8;--fill:#D2E4EE;--hair:#86AFC3;--dark:#2F5D78;--acc:#2F5D78;--onink:#FFFFFF;--tabbg:rgba(220,234,242,0.92);--tabsolid:#DCEAF2;--navbg:rgba(220,234,242,0.92);--glass:rgba(246,250,252,0.92)}
html[data-theme="oat"]{--page:#E1D0B5;--bg:#EFE3CF;--card:#FBF5EA;--ink:#3A2C1F;--ink2:#5A4634;--mute:#87725C;--line:#E2D2B9;--fill:#E8DAC3;--hair:#C4AE8F;--dark:#9A6534;--acc:#9A6534;--onink:#FFFFFF;--tabbg:rgba(239,227,207,0.92);--tabsolid:#EFE3CF;--navbg:rgba(239,227,207,0.92);--glass:rgba(251,245,234,0.92)}
html[data-theme="sage"]{--page:#C8D8C0;--bg:#DCE7D6;--card:#F5F9F2;--ink:#23321F;--ink2:#3D5039;--mute:#6D8068;--line:#CDDCC6;--fill:#D3E1CC;--hair:#A3B99C;--dark:#4C7A55;--acc:#4C7A55;--onink:#FFFFFF;--tabbg:rgba(220,231,214,0.92);--tabsolid:#DCE7D6;--navbg:rgba(220,231,214,0.92);--glass:rgba(245,249,242,0.92)}
html[data-theme="lavender"]{--page:#D2CBE8;--bg:#E4DFF2;--card:#F8F6FD;--ink:#2A2440;--ink2:#463E63;--mute:#7A7299;--line:#D8D1EC;--fill:#DCD5EE;--hair:#ADA3CF;--dark:#6A55B0;--acc:#6A55B0;--onink:#FFFFFF;--tabbg:rgba(228,223,242,0.92);--tabsolid:#E4DFF2;--navbg:rgba(228,223,242,0.92);--glass:rgba(248,246,253,0.92)}
html[data-theme="rose"]{--page:#E6C9C8;--bg:#F2DEDD;--card:#FDF6F5;--ink:#3D2226;--ink2:#5C3B40;--mute:#94706F;--line:#E8D0CF;--fill:#EDD6D5;--hair:#CDA3A3;--dark:#A64D5A;--acc:#A64D5A;--onink:#FFFFFF;--tabbg:rgba(242,222,221,0.92);--tabsolid:#F2DEDD;--navbg:rgba(242,222,221,0.92);--glass:rgba(253,246,245,0.92)}
html{background:var(--page)}
/* SVG 屬性顏色跟著主題（QR Code 保持黑白方便掃描） */
.device [fill="#1D1D1F"]:not(.qr *),.device [fill="#1a1a1a"]:not(.qr *){fill:var(--ink)}
.device [stroke="#1D1D1F"]{stroke:var(--ink)}
.device [fill="#8E8E93"]{fill:var(--mute)}.device [stroke="#8E8E93"]{stroke:var(--mute)}
.device [stroke="#D1D1D6"],.device [stroke="#E5E5EA"]{stroke:var(--hair)}
.device [fill="#F2F2F7"]{fill:var(--fill)}.device [fill="#F9F9F9"]{fill:var(--tabsolid)}
.device [fill="#fff"]:not(.qr *){fill:var(--card)}.device [stroke="#fff"]{stroke:var(--onink)}
.device [fill="#3C3C43"]{fill:var(--ink2)}
.device .ok-ic path{stroke:var(--onink)}
html.theming .device,html.theming .device *{transition:background-color .35s ease,color .35s ease,border-color .35s ease,fill .35s ease,stroke .35s ease!important}
.thm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thm button{border-radius:18px;padding:10px;background:var(--card);border:2px solid transparent;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .12s}
.thm button:active{transform:scale(.97)}
.thm button.on{border-color:var(--acc)}
.thm .pv{height:86px;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.thm .pv i{display:block;border-radius:6px}
.thm .nm{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
.thm .sw{display:flex;gap:4px}.thm .sw i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--page);font-family:var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.device{position:relative;width:393px;height:min(852px,calc(100% - 32px));max-width:100%;background:var(--bg);border-radius:52px;overflow:hidden;box-shadow:0 0 0 11px #111,0 30px 80px rgba(0,0,0,.25)}

/* 手機體驗 */
@media (max-width:520px){
 body{background:var(--bg)}
 .nav,.big{padding-top:max(54px,calc(env(safe-area-inset-top,0px) + 6px))}
 .footer{padding-bottom:max(34px,calc(env(safe-area-inset-bottom,0px) + 12px))}
 .tabbar{padding-bottom:max(30px,env(safe-area-inset-bottom,0px))}
 .sheet{bottom:max(8px,env(safe-area-inset-bottom,0px))}
}

.sec .link{padding:10px 4px!important;margin:-10px -4px}
[data-act="locpick"]{padding:10px 0 10px 8px!important;margin:-10px 0}
html{height:100%;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
[data-act]{transition:transform .12s ease,opacity .12s ease}
[data-act]:active{transform:scale(.97);opacity:.85}
.tabbar [data-act]:active{transform:scale(.92)}
.edge-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 30%);opacity:0;transition:opacity .2s;z-index:50}
@media (max-width:520px){html,body{height:100%;min-height:100dvh}body{padding:0!important}.device{height:100dvh!important}}
@media (max-width:520px){body{padding:0}.device{width:100%;height:100%;border-radius:0;box-shadow:none}}

/* screens */
.stack{position:absolute;inset:0}
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s}
.screen.enter{transform:translateX(100%)}
.screen.under{transform:translateX(-28%);opacity:.6}
.screen.leave{transform:translateX(100%)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 120px}
.tabbed .scroll{padding-bottom:130px}

.nav{padding:54px 16px 6px;display:flex;align-items:center;gap:8px;min-height:96px}
.nav .back{display:flex;align-items:center;gap:2px;font-size:17px;color:var(--ink);padding:6px 4px 6px 0}
.nav .back svg{width:12px;height:20px}
.nav .ttl{flex:1;text-align:center;font-weight:600;font-size:17px;margin-right:52px}
.big{padding:54px 16px 10px;display:flex;align-items:flex-end;justify-content:space-between}
.big h1{font-size:34px;font-weight:800;letter-spacing:.2px}
.big .icon-btn{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center}

.cat{width:30px;height:30px;color:var(--ink)}
.sec{font-size:13px;color:var(--mute);margin:22px 4px 8px;letter-spacing:.3px}
.card{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:52px;width:100%;text-align:left}
.row+.row{border-top:.5px solid var(--line)}
.row .k{flex:1;font-size:16px}
.row .v{color:var(--mute);font-size:16px}
.chev{width:8px;height:14px;color:var(--hair);flex:0 0 auto}
.note{font-size:12px;color:var(--mute);margin:10px 4px 0;line-height:1.5}

.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:14px;background:var(--acc);color:var(--onink);font-size:17px;font-weight:600;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.35}
.footer{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 34px;background:var(--navbg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--line);display:flex;flex-direction:column;gap:10px;z-index:6}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--ink2)}
.total b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 8px 30px;background:var(--tabbg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--hair);z-index:5}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--dim);width:72px}
.tabbar button.on{color:var(--acc)}
html[data-theme="mist"] .tabbar button,html[data-theme="oat"] .tabbar button,html[data-theme="sage"] .tabbar button,html[data-theme="lavender"] .tabbar button,html[data-theme="rose"] .tabbar button{color:var(--mute)}html[data-theme] .tabbar button.on{color:var(--acc)}
.tabbar svg{width:26px;height:26px;fill:currentColor}
.hide-tabs .tabbar{display:none}

/* home */
.loc{padding:16px}
.map{height:150px;border-radius:14px;background:var(--fill);position:relative;overflow:hidden;margin-top:12px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.chip{background:var(--card);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.chip b{font-size:15px}.chip span{font-size:13px;color:var(--mute)}
.chip em{font-style:normal;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}

/* segmented */
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:10px;padding:2px;margin:6px 0 0}
.seg button{flex:1;padding:8px 0;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12)}

.od{position:relative;padding:4px 16px}
.od .f{padding:12px 0;display:flex;flex-direction:column;gap:2px}
.od .f+.f{border-top:.5px solid var(--line)}

const CJK=/[぀-ヿ㐀-鿿豈-﫿]/;

const SEPRE=/( · | → |，|。|、|／|：|（|）|！|？|「|」|；)/;
const TOK=/\u0002\d+\u0002|(?:NT\$|US\$|¥|[+−-])?[A-Za-z]*\d[\w,.:\/%$–•]*|\b[A-Z][A-Za-z]*(?:[ -][A-Z][A-Za-z]+)*/g;

function tx(s){if(S.lang==='zh'||!s||!CJK.test(s)||/[\u3040-\u30ff]/.test(s))return s;const L=S.lang,k=L==='en'?0:1;
 const whole=PH[s.trim()]||PN[s.trim()];if(whole)return s.replace(s.trim(),whole[k]);
 const keep=[];const prot=v=>'\u0002'+(keep.push(v)-1)+'\u0002';
 s=s.replace(/台北101\/世貿/g,()=>prot(PN['台北101/世貿'][k]))
  .replace(/（([日一二三四五六])）/g,(m,w)=>prot(L==='en'?' ('+WDX.en[WDZ.indexOf(w)]+')':'（'+WDX.ja[WDZ.indexOf(w)]+'）'))
  .replace(/週([日一二三四五六])/g,(m,w)=>prot(L==='en'?WDX.en[WDZ.indexOf(w)]:WDX.ja[WDZ.indexOf(w)]+'曜'));
 return s.split(SEPRE).map(p=>SEPS[L][p]!==undefined?SEPS[L][p]:phr(p,k)).join('').replace(/\u0002(\d+)\u0002/g,(m,i)=>keep[i]).replace(/ {2,}/g,' ')}
function phr(p,k){if(!CJK.test(p))return p;const lead=p.match(/^\s*/)[0],tail=p.match(/\s*$/)[0];const core=p.trim();const nums=[];
 const tpl=core.replace(TOK,m=>{nums.push(m);return '{'+(nums.length-1)+'}'});
 const fill=t=>t.replace(/\{(\d+)\}/g,(m,i)=>nums[i]);
 const h=PH[tpl]||PN[tpl];if(h)return lead+fill(h[k])+tail;
 if(!PNK)PNK=Object.keys(PN).sort((a,b)=>b.length-a.length);
 let t2=tpl;const nn=[];for(const n of PNK)if(t2.includes(n)){t2=t2.split(n).join('\u0003'+nn.length+'\u0003');nn.push(PN[n][k])}
 const back=t=>fill(t.replace(/\u0003(\d+)\u0003/g,(m,i)=>nn[i]));
 if(nn.length&&!CJK.test(t2))return lead+back(t2)+tail;
 const t3=t2.replace(/\u0003\d+\u0003/g,'@');if(nn.length===1&&PH[t3])return lead+back(PH[t3][k].replace('@','\u00030\u0003'))+tail;
 MISS.add(tpl);return p}

function build(){const id=cur(),def=SCREENS[id];const el=document.createElement('section');el.className='screen'+(def.tabbed?' tabbed':'');el.dataset.id=id;el.innerHTML=def.html();L10N(el);return [el,def]}
function syncTabs(){document.querySelectorAll('.tabbar button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===S.tab);b.querySelector('span').textContent=tr(b.dataset.tab)})}
function render(anim){
  const st=$('#stack');const [el,def]=build();const prev=st.lastElementChild;
  $('#dev').classList.toggle('hide-tabs',!def.tabbed);
  if(anim==='push'&&prev){el.classList.add('enter');st.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.remove('enter');prev.classList.add('under')}));setTimeout(()=>prev.remove(),400);}
  else if(anim==='pop'&&prev){el.classList.add('under');st.insertBefore(el,prev);requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.remove('under');prev.classList.add('leave')}));setTimeout(()=>prev.remove(),400);}
  else{st.innerHTML='';if(anim==='fade')el.classList.add('fade');st.appendChild(el);}
  def.after&&def.after(el,false);syncTabs();
}
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
  if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name)&&!(at.name==='open'&&a.tagName==='DETAILS')&&at.name!=='hidden')a.removeAttribute(at.name);
  for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  if((a.tagName==='INPUT')&&document.activeElement!==a&&a.value!==b.value)a.value=b.value;
  const ac=[...a.childNodes],bc=[...b.childNodes];
  bc.forEach((n,i)=>{if(i<ac.length)morph(ac[i],n);else a.appendChild(n)});
  for(let i=bc.length;i<ac.length;i++)ac[i].remove();
}
function rerender(){const st=$('#stack');const old=[...st.children].filter(x=>!x.classList.contains('leave')).pop();if(!old)return render();

  const nt=old.querySelector('.total b');if(nt&&was&&nt.textContent!==was){nt.classList.remove('bump');void nt.offsetWidth;nt.classList.add('bump')}
  def.after&&def.after(old,true);syncTabs()}

   S.tickets.unshift(t);S.newTicket=id;S.holdUntil=null;addNotif('ok','訂票成功',`${nm(t.mode,a)} → ${nm(t.mode,b)} · ${t.date} ${t.dep}`,id);
   if(S.np.dep)setTimeout(()=>banner('出發提醒已設定',`${t.date} ${t.dep} 出發，會在 ${S.remind}通知你`),900)}
  if(v==='timeout')S.holdUntil=null;push(v)},
 seeticket:()=>{stacks.home=['home'];S.tixSeg='up';const id=S.newTicket;S.tab='tickets';if(id&&tk(id)){S.view=id;stacks.tickets=['tickets','ticket']}else stacks.tickets=['tickets'];render('fade')}, home:()=>{S.holdUntil=null;stacks.home=['home'];render('pop')},
 retry:()=>popTo('payment'), research:()=>{S.holdUntil=null;popTo('search')},
 tixseg:e=>{S.tixSeg=e.dataset.v;buzz();rerender()}, ticket:e=>{S.view=e.dataset.id;push('ticket')},
 histseg:e=>{S.histSeg=e.dataset.v;buzz();rerender()}, histf:e=>{S.histF=e.dataset.v;rerender()},
 rebook:()=>{const t=tk(S.view);setSearch(t.mode,[t.a,t.b],2);if(S.tab!=='home')goTab('home',true);stacks.home=['home'];push('search');toast('已帶入同一段路線')},
 refund:()=>{S.rr='行程改變';push('refund')},
 refundask:()=>{const t=tk(S.view),r=Math.max(0,t.price-rules(t).ref*t.pax);confirmSheet('確定要退票？',`預計退款 <b>${NT(r)}</b>，7–14 個工作天退回原付款方式。送出後 QR Code 會立刻失效，無法復原。`,'確定退票','refundgo','保留車票')},
 refundgo:()=>{const t=tk(S.view);t.refund=Math.max(0,t.price-rules(t).ref*t.pax);t.status='refunding';closeSheet();
  if(S.np.refund){addNotif('refund','退票申請已收到',`${nm(t.mode,t.a)} → ${nm(t.mode,t.b)} · 預計退款 ${NT(t.refund)}`,t.id);setTimeout(()=>banner('退票申請已收到','審核完成後會再通知你'),900)}
  replace('refundDone')},

 change:()=>{const t=tk(S.view);S.ch={di:Math.max(0,t.di),id:null};push('change')},
 chday:e=>{S.ch.di=+e.dataset.v;S.ch.id=null;rerender()}, chpick:e=>{S.ch.id=e.dataset.id;buzz();rerender()},

  confirmSheet('確認改票？',`改為 <b>${dlabel(S.ch.di)} ${x.dep}</b> · ${x.id}。${due>0?`需補付 <b>${NT(due)}</b>，以原付款方式扣款。`:due<0?`差額 <b>${NT(-due)}</b> 會退回原付款方式。`:'不需補付差額。'}原本的 QR Code 會失效。`,'確認改票','changego')},
 changego:()=>{const t=tk(S.view),x=S.ch.sel;const f=t.mode==='flight';Object.assign(t,{code:f?x.id:'車次 '+x.id,num:f?null:x.id,pn:x.pn,dep:x.dep,arr:x.arr+(x.next?' +1':''),dur:x.dur,di:S.ch.di,date:dlabel(S.ch.di),ord:20261200+DAYS[S.ch.di].d,unit:x.unit,price:t.price+x.due,status:'changed',eb:0,k:x.k,south:x.south,al:f?x.al:t.al,ac:f?x.ac:t.ac,seat:f?'座位 報到時配位':`${3+hash(x.id)%6} 車 ${1+hash(x.id)%15}${'ABCDE'[hash(x.id)%5]}`});
  closeSheet();addNotif('ok','改票完成',`${nm(t.mode,t.a)} → ${nm(t.mode,t.b)} · ${t.date} ${t.dep}`,t.id);popTo('ticket');setTimeout(()=>toast('改票完成，新 QR Code 已更新'),350)},

 toast:e=>toast(e.dataset.msg), open:e=>push(e.dataset.v),

 faqcat:e=>{S.faqCat=e.dataset.v;rerender()},
 ask:e=>sendChat(e.dataset.v), send:()=>{const i=$('#msg');if(i&&i.value.trim())sendChat(i.value.trim())},

  const id='XI-1213-0'+(381+S.cases.length);S.cases.unshift({id,t:S.rep.type,st:'處理中'});S.lastCase=id;addNotif('support','已收到你的回報',`案件 ${id} · ${S.rep.type}`);replace('reportDone')},
};

function load(){S.loading=true;setTimeout(()=>{S.loading=false;if(cur()==='results')rerender()},650)}

/* ---------- events ---------- */
const dev=$('#dev');let swiped=false;
dev.addEventListener('click',e=>{if(swiped){swiped=false;return}const b=e.target.closest('[data-act]');if(b){if(b.disabled)return;A[b.dataset.act]&&A[b.dataset.act](b);return}const t=e.target.closest('[data-tab]');if(t){const id=t.dataset.tab;if(id==='tickets')S.newTicket=null;goTab(id,S.tab===id)}});
dev.addEventListener('input',e=>{const id=e.target.id;if(id==='faqq'){S.faqQ=e.target.value;applyFaq(e.target.closest('.screen'))}if(id==='pq'){S.pq=e.target.value;applyPicker(e.target.closest('.screen'))}if(id==='rdesc')setErr('f-desc','');if(/^pe-/.test(id))setErr('f-'+id.slice(3),'');if(id==='pf-nick'){setErr('f-nick','');const c=$('#nickcount');if(c)c.textContent=[...e.target.value].length}if(id==='pf-phone')setErr('f-phone','')});
dev.addEventListener('change',e=>{if(e.target.id!=='avfile'||!e.target.files[0])return;const f=e.target.files[0];if(!/^image\//.test(f.type)){toast('請選擇圖片檔');return}
 const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);S.avatar={type:'img',src:c.toDataURL('image/jpeg',.85)};closeSheet();rerender();toast('頭像已更新')};im.src=rd.result};rd.readAsDataURL(f);e.target.value=''});
setInterval(()=>{if(['transit','line','home'].includes(cur())&&!document.querySelector('#sheet.open'))rerender()},10000);
dev.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='msg')A.send();if(e.target.id==='code')A.apply()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
/* 從左邊緣滑動返回（iOS 手勢） */
let sw=null;
dev.addEventListener('pointerdown',e=>{const r=dev.getBoundingClientRect();if(e.clientX-r.left>28||stacks[S.tab].length<2||document.querySelector('#sheet.open'))return;const el=[...$('#stack').children].pop();if(!el||!el.querySelector('.back'))return;sw={x:e.clientX,el,dx:0,under:null}});
dev.addEventListener('pointermove',e=>{if(!sw)return;sw.dx=Math.max(0,e.clientX-sw.x);if(sw.dx>4){sw.el.style.transition='none';sw.el.style.transform=`translateX(${sw.dx}px)`;sw.el.style.boxShadow='-10px 0 30px rgba(0,0,0,.12)'}});
const endSw=()=>{if(!sw)return;const {el,dx}=sw;sw=null;el.style.transition='';el.style.boxShadow='';if(dx>4){swiped=true;setTimeout(()=>swiped=false,60)}if(dx>90){el.style.transform='translateX(100%)';pop()}else el.style.transform=''};
dev.addEventListener('pointerup',endSw);dev.addEventListener('pointercancel',endSw);
/* 座位保留倒數 */
const BOOK=['pax','paxEdit','seat','addons','promo','payment','verify','failed'];
setInterval(()=>{if(!S.holdUntil)return;document.querySelectorAll('.hold-t').forEach(x=>x.textContent=fmtHold());if(Date.now()>=S.holdUntil){S.holdUntil=null;if(BOOK.includes(cur())){closeSheet();push('timeout')}}},1000);
try{const v=JSON.parse(localStorage.getItem('xi-theme')||'null');if(v&&THEMES.some(x=>x[0]===v.t)){S.theme=v.t;S.themeAuto=!!v.a}}catch(e){}
applyTheme(false);try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.themeAuto){applyTheme(true);rerender()}})}catch(e){}
render();

document.addEventListener('gesturestart',e=>e.preventDefault());

if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai')&&!location.hostname.includes('claudeusercontent')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
